<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bodyline">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Bodyline</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout: iOS-Gesundheit-Stil, gruppierter grauer Grund, weiße Karten mit großen Radien, Large Title, Systemblau als einziger Akzent */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#000000; --ink-2:#3C3C43; --ink-3:#8A8A8E; --line:#E5E5EA; --line-2:#C6C6C8; --fill:#EEEEF0;
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --fat:#FF9F0A; --muscle:#5AA2FF; --bone:#C7C7CC; --rest:#DADADF; --body:#ECECF0;
  --good:#34C759; --bad:#FF3B30; --surface:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --ink-2:#EBEBF5; --ink-3:#8E8E93; --line:#2C2C2E; --line-2:#38383A; --fill:#2C2C2E;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.2); --fat:#FFB340; --muscle:#409CFF; --bone:#636366; --rest:#3A3A3C; --body:#2C2C2E;
  --good:#30D158; --bad:#FF453A; --surface:#1C1C1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#FFFFFF; --ink-2:#EBEBF5; --ink-3:#8E8E93; --line:#2C2C2E; --line-2:#38383A; --fill:#2C2C2E;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.2); --fat:#FFB340; --muscle:#409CFF; --bone:#636366; --rest:#3A3A3C; --body:#2C2C2E;
  --good:#30D158; --bad:#FF453A; --surface:#1C1C1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.012em;margin:0;line-height:1.1}
h2{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.01em;margin:0 0 10px;padding-left:4px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.card{background:var(--card);border-radius:14px;padding:16px}
.cap{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-inline:4px}
.hdr-r{display:flex;align-items:center;gap:14px;font-size:15px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.addbtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:17px;cursor:pointer;user-select:none}
.addbtn .plus{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;font-weight:500}
.addbtn:hover{opacity:.75}
.btn{font:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:11px 18px;cursor:pointer;border:0;background:var(--fill);color:var(--accent)}
.btn.solid{background:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.link{font:inherit;font-size:15px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer}
button:focus-visible,input:focus-visible,.dot:focus-visible,.addbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.due{font-size:13px;color:var(--ink-3)}
.due.late{color:var(--bad)}

/* Upload review */
.review{display:flex;flex-direction:column;gap:16px}
.review .title{font-size:17px;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3)}
.fields input{font:inherit;font-size:16px;padding:9px 11px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);width:100%}
.fields input.missing{box-shadow:inset 0 0 0 1.5px var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:13px;color:var(--ink-3)} .msg.err{color:var(--bad)}
.dropveil{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 80%,transparent);font-size:17px;color:var(--accent);pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* Hero */
.hero{display:flex;flex-direction:column;gap:18px;padding:20px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:clamp(46px,8vw,60px);font-weight:700;letter-spacing:-.01em;line-height:1}
.big small{font-size:18px;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.delta{font-size:15px;margin-top:6px;color:var(--ink-3)}
.trio{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,190px) minmax(0,1fr);gap:20px;align-items:center}
.side{display:flex;flex-direction:column;gap:8px}
.metric{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.metric .lbl{font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.metric .val{font-family:var(--display);font-size:22px;font-weight:700}
.metric .val small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.metric .sub{font-size:12px;color:var(--ink-3)}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block}
.fig{display:flex;flex-direction:column;align-items:center}
.fig svg{width:100%;max-width:180px;height:auto;display:block}
.timeline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:50%;border:0;background:var(--line-2);padding:0;cursor:pointer}
.dot.on{background:var(--accent)}
@media (max-width:640px){
  .trio{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .fig{grid-column:1/-1;order:-1;margin-bottom:10px}
  .fig svg{max-width:160px}
}

/* Charts */
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.chart-head .t{font-size:17px;font-weight:600}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;font-size:13px}
.seg button{font:inherit;font-weight:500;background:none;border:0;padding:5px 12px;border-radius:7px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.mini{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mini .lbl{font-size:13px;font-weight:600;color:var(--accent)}
.mini .val{font-family:var(--display);font-size:24px;font-weight:700}
.mini .lbl.num{color:var(--ink-3);font-weight:400;font-size:12px}
.mini svg{width:100%;height:auto;margin-top:6px}
.note{font-size:12px;color:var(--ink-3);margin:8px 0 0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:12px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat .lbl{font-size:13px;font-weight:600;color:var(--ink-3)}
.stat .val{font-family:var(--display);font-size:26px;font-weight:700}
.stat .val small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.stat .ctx{font-size:13px;color:var(--ink-3)}
.notes{list-style:none;margin:12px 0 0;padding:0;background:var(--card);border-radius:14px}
.notes:empty{display:none}
.notes li{font-size:15px;color:var(--ink);padding:12px 16px 12px 36px;position:relative;border-bottom:.5px solid var(--line-2)}
.notes li:last-child{border-bottom:0}
.notes li::before{content:"";position:absolute;left:16px;top:19px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.notes li.warn::before{background:var(--bad)}

/* Archive */
.arch{background:var(--card);border-radius:14px;overflow:hidden}
.arow{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr)) auto;gap:12px;align-items:center;padding:12px 16px;font-size:15px;position:relative}
.arow+.arow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line-2)}
.arow .date{font-weight:600}
.arow .sub{font-size:12px;color:var(--ink-3)}
.arow .acts{display:flex;gap:16px;justify-content:flex-end;align-items:center}
.arow .del{color:var(--bad)}
.arow .del.confirm{font-weight:600}
@media (max-width:560px){.arow{grid-template-columns:minmax(0,1fr) auto}.arow .c{display:none}}
.viewer{padding:14px 0 4px;display:flex;flex-direction:column;gap:10px;grid-column:1/-1}
.viewer canvas{width:100%;height:auto;border-radius:10px;background:#fff;box-shadow:0 0 0 .5px var(--line-2)}
.empty{font-size:15px;color:var(--ink-3);padding:14px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="todayLbl"></div>
      <h1>Bodyline</h1>
    </div>
    <div class="hdr-r">
      <span id="due" class="due"></span>
      <label class="addbtn" for="file" role="button" tabindex="0" id="addLabel"><span class="plus">+</span>Bericht</label>
      <input type="file" id="file" accept="application/pdf,.pdf">
    </div>
  </header>

  <section class="card review" id="review" hidden>
    <div>
      <div class="title">Bericht prüfen</div>
      <div class="msg" id="reviewMsg"></div>
    </div>
    <div class="fields" id="fields"></div>
    <div class="row">
      <button class="btn solid" id="save">Speichern</button>
      <button class="btn" id="cancel">Abbrechen</button>
      <span class="msg" id="saveMsg"></span>
    </div>
  </section>

  <section class="card hero">
    <div class="hero-top">
      <div>
        <div class="cap" id="heroDate">–</div>
        <div class="big num" id="heroWeight">–</div>
        <div class="delta num" id="heroDelta"></div>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="trio">
      <div class="side l" id="sideL"></div>
      <div class="fig">
        <svg id="figure" viewBox="0 0 220 420" role="img" aria-label="Figur mit Körperzusammensetzung"></svg>
      </div>
      <div class="side r" id="sideR"></div>
    </div>
  </section>

  <section>
    <h2>Verlauf</h2>
    <div class="card chart">
      <div class="chart-head">
        <span class="t">Gewicht</span>
        <div class="seg" id="range">
          <button data-r="30">M</button><button data-r="90">3M</button><button data-r="365">J</button><button data-r="0" class="on">Alle</button>
        </div>
      </div>
      <div id="wchart"></div>
      <p class="note" id="wnote"></p>
    </div>
    <div class="minis" id="minis" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>Kennzahlen</h2>
    <div class="stats" id="stats"></div>
    <ul class="notes" id="notes"></ul>
  </section>

  <section>
    <h2>Archiv</h2>
    <div class="arch" id="archive"></div>
    <div class="row" style="margin-top:12px;padding-left:4px">
      <button class="link" id="exportBtn" type="button">Sicherung exportieren</button>
      <label class="link" for="importFile" style="cursor:pointer">Sicherung importieren</label>
      <input type="file" id="importFile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0">
      <span class="msg" id="backupMsg">Daten bleiben nur in diesem Browser gespeichert.</span>
    </div>
  </section>
</div>
<div class="dropveil" id="veil" hidden>PDF loslassen, um den Bericht hinzuzufügen</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const HEIGHT_CM=166, HM=HEIGHT_CM/100;
const FIELDS=[['date','Messdatum','date'],['weight','Gewicht kg'],['fatPct','Fett %'],['muscle','Muskeln kg'],['lean','Magermasse kg'],
  ['water','Wasser kg'],['bone','Knochen kg'],['visceral','Viszeralfett'],['bmr','Grundumsatz kcal'],['metAge','Stoffwechselalter'],
  ['steps','Schritte/Tag Ø'],['activeMin','Aktive Min./Tag Ø']];

/* ---------- Parser ---------- */
function toNum(s){if(s==null)return null;s=String(s).trim();
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^[-+]?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:null}
const MON={jan:1,feb:2,'mär':3,mar:3,mrz:3,apr:4,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dez:12};
const MRE='(Jan|Feb|Mär|Mar|Mrz|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)[a-zä]*\\.?';
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function parseReport(raw){
  const t=raw.replace(/\s+/g,' '), N='([-+]?\\d[\\d.]*(?:,\\d+)?)', G='[^\\d+-]{0,4}';
  const r={change:{}};
  const pm=t.match(new RegExp('(\\d{1,2})\\.?\\s*'+MRE+'\\s*(\\d{4})?\\s*[-–]\\s*(\\d{1,2})\\.?\\s*'+MRE+'\\s*(\\d{4})','i'));
  const sm=t.match(new RegExp('(\\d{1,2})\\.?\\s*'+MRE+'\\s*(\\d{4})','i'));
  if(pm){const em=MON[pm[5].toLowerCase().slice(0,3)],ey=+pm[6],sm_=MON[pm[2].toLowerCase().slice(0,3)];
    r.date=iso(ey,em,pm[4]);r.periodStart=iso(pm[3]?+pm[3]:(sm_>em?ey-1:ey),sm_,pm[1])}
  else if(sm){const m=MON[sm[2].toLowerCase().slice(0,3)];if(m)r.date=iso(sm[3],m,sm[1])}
  const pair=(key,label,unit)=>{const u=unit?'\\s*'+unit:'';
    const m=t.match(new RegExp(label+'\\s+'+N+u+'\\s*(?:Neueste|Durchschnitt)(?:'+G+N+u+'\\s*Verlauf)?'));
    if(m){r[key]=toNum(m[1]);if(m[2]!=null)r.change[key]=toNum(m[2])}};
  pair('weight','Gewicht','kg');pair('bmr','BMR','kcal');pair('bone','Knochenmasse','kg');pair('muscle','Muskelmasse','kg');
  pair('visceral','Viszeralfett','');pair('lean','Magermasse','kg');pair('water','Wassermasse','kg');
  const fm=t.match(new RegExp('Fettmasse\\s+'+N+'\\s*(%|kg)\\s*Neueste(?:'+G+N+'\\s*(?:%|kg)\\s*Verlauf)?'));
  if(fm){const v=toNum(fm[1]);r.fatPct=fm[2]==='%'?v:(r.weight?+(v/r.weight*100).toFixed(1):null);
    if(fm[3]!=null&&fm[2]==='%')r.change.fatPct=toNum(fm[3])}
  const ma=t.match(/(\d{1,3})\s*Jahre\s*Stoffwechselalter/);if(ma)r.metAge=+ma[1];
  const st=t.match(new RegExp('Schrittzahl\\s+'+N+'\\s*Schritte'));if(st)r.steps=toNum(st[1]);
  const am=t.match(new RegExp('Aktive Minuten pro Tag\\s+'+N+'\\s*min'));if(am)r.activeMin=toNum(am[1]);
  return r;
}
async function pdfFromBuffer(buf){return pdfjsLib.getDocument({data:buf}).promise}
async function pdfText(doc){let out='';for(let i=1;i<=doc.numPages;i++){const c=await(await doc.getPage(i)).getTextContent();out+=' '+c.items.map(x=>x.str).join(' ')}return out}

/* ---------- Storage (IndexedDB, nur in diesem Browser) ---------- */
let reports=[];
const IDB=new Promise((res,rej)=>{const q=indexedDB.open('bodyline',1);
  q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('reports',{keyPath:'date'});d.createObjectStore('pdfs')};
  q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
async function tx(store,mode,fn){const d=await IDB;return new Promise((res,rej)=>{const t=d.transaction(store,mode);const st=t.objectStore(store);const out=fn(st);
  t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})}
const idbAll=()=>tx('reports','readonly',st=>st.getAll());
async function loadAll(){try{reports=await idbAll()}catch(e){reports=[]}sortR();render()}
const sortR=()=>reports.sort((a,b)=>a.date<b.date?-1:1);
async function saveReport(r){await tx('reports','readwrite',st=>st.put(r));await loadAll()}
async function deleteReport(r){await tx('reports','readwrite',st=>st.delete(r.date));if(r.pdfAsset)await tx('pdfs','readwrite',st=>st.delete(r.pdfAsset));await loadAll()}

/* ---------- Helpers ---------- */
const fmt=(v,d=1)=>v==null||!isFinite(v)?'–':v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=1)=>(v>0?'+':v<0?'−':'±')+fmt(Math.abs(v),d);
const MN=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
const dLong=s=>{const[y,m,d]=s.split('-');return `${+d}. ${MN[+m-1]} ${y}`};
const dShort=s=>{const[,m,d]=s.split('-');return `${d}.${m}.`};
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const today=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const isoD=d=>iso(d.getFullYear(),d.getMonth()+1,d.getDate());
function cadence(latest){ // Berichte immer dienstags und freitags
  const now=new Date();now.setHours(12,0,0,0);
  const back=new Date(now);while(![2,5].includes(back.getDay()))back.setDate(back.getDate()-1);
  const next=new Date(now);next.setDate(next.getDate()+1);while(![2,5].includes(next.getDay()))next.setDate(next.getDate()+1);
  const dueIso=isoD(back);
  if(!latest||latest.date<dueIso)return{late:true,text:`Bericht für ${WD[back.getDay()]}, ${dShort(dueIso)} fehlt`};
  if(now.getDay()===2||now.getDay()===5)return{late:false,text:'Heutiger Bericht ist drin'};
  return{late:false,text:`Nächster Bericht: ${WD[next.getDay()]}, ${dShort(isoD(next))}`};
}
const fatKg=r=>r&&r.weight&&r.fatPct!=null?r.weight*r.fatPct/100:null;
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const S=(tag,a={})=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e};
const H=(tag,a={},html)=>{const e=document.createElement(tag);for(const k in a)e.setAttribute(k,a[k]);if(html!=null)e.innerHTML=html;return e};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Figure ---------- */
const CX=100, TOP=4, BOT=405;
function crPath(pts,closed){ // Catmull-Rom -> Bezier
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;const n=pts.length;
  for(let i=0;i<(closed?n:n-1);i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const q0=closed||i>0?p0:p1, q3=closed||i<n-2?p3:p2;

    const show=H('button',{class:'link',type:'button'},r.pdfAsset?'PDF ›':'Ansehen ›');
    const del=H('button',{class:'link del',type:'button'},'Löschen');
    acts.append(show,del);row.appendChild(acts);a.appendChild(row);
    let viewer=null;
    show.onclick=async()=>{if(viewer){viewer.remove();viewer=null;show.textContent=r.pdfAsset?'PDF ›':'Ansehen ›';return}
      viewer=H('div',{class:'viewer'});row.appendChild(viewer);show.textContent='Schließen';
      selected=r.date;render2Figure();
      if(!r.pdfAsset){viewer.innerHTML='<div class="msg">Zu diesem Bericht ist keine PDF gespeichert. Die Figur oben zeigt jetzt seinen Stand.</div>';return}
      viewer.innerHTML='<div class="msg">PDF wird geladen …</div>';
      try{const blob=await tx('pdfs','readonly',st=>st.get(r.pdfAsset));if(!blob)throw new Error('fehlt');const doc=await pdfFromBuffer(await blob.arrayBuffer());viewer.innerHTML='';
        for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const vp=pg.getViewport({scale:1});
          const w=Math.min(viewer.clientWidth||700,900),sc=w/vp.width*(window.devicePixelRatio||1);const v=pg.getViewport({scale:sc});
          const cv=H('canvas',{width:Math.round(v.width),height:Math.round(v.height)});viewer.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise}
      }catch(e){viewer.innerHTML='<div class="msg err">Die PDF konnte nicht geladen werden. Bitte später erneut versuchen.</div>'}};
    del.onclick=async()=>{if(!del.classList.contains('confirm')){del.classList.add('confirm');del.textContent='Wirklich löschen?';setTimeout(()=>{del.classList.remove('confirm');del.textContent='Löschen'},4000);return}
      del.disabled=true;try{await deleteReport(r)}catch(e){del.disabled=false;del.textContent='Fehler'}};
  });
}
function render2Figure(){const cur=reports.find(r=>r.date===selected);if(!cur)return;setFigure(cur);
  document.querySelectorAll('#timeline .dot').forEach((b,i)=>b.classList.toggle('on',reports[i]===cur));
  const idx=reports.indexOf(cur),prev=idx>0?reports[idx-1]:null,latest=reports[reports.length-1];
  $('heroDate').textContent=dLong(cur.date)+(cur===latest?'':' · älterer Bericht');$('heroWeight').innerHTML=`${fmt(cur.weight)}<small>kg</small>`;
  $('heroDelta').innerHTML=prev?`${sgn(cur.weight-prev.weight)} kg seit ${dShort(prev.date)}`:(cur.change&&cur.change.weight!=null&&cur.periodStart?`${sgn(cur.change.weight)} kg seit ${dShort(cur.periodStart)}`:'');
  renderComp(cur,prev);renderStats(cur,prev)}

/* ---------- Upload ---------- */
let draft=null,draftFile=null;
function showReview(parsed,name,errText){
  draft=parsed;$('review').hidden=false;
  const missing=FIELDS.filter(f=>parsed[f[0]]==null).map(f=>f[1]);
  const m=$('reviewMsg');m.classList.toggle('err',!!errText);
  m.textContent=errText||(`Aus „${name}“ gelesen. `+(missing.length?`Nicht erkannt: ${missing.join(', ')}.`:'Alle Werte erkannt.'));
  const fs=$('fields');fs.innerHTML='';
  for(const [k,l,type] of FIELDS){const lab=H('label',{for:'f_'+k},l);const i=H('input',{id:'f_'+k,type:type||'text',inputmode:type?'text':'decimal'});
    i.value=parsed[k]==null?'':(type?parsed[k]:String(parsed[k]).replace('.',','));if(parsed[k]==null)i.classList.add('missing');lab.appendChild(i);fs.appendChild(lab)}
  $('saveMsg').textContent='';$('review').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
}
async function handleFile(file){
  if(!file)return;draftFile=null;
  if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf'){showReview({date:today()},file.name,'Das ist keine PDF. Lade den Withings-Bericht als PDF hoch oder trag die Werte selbst ein.');return}
  try{const doc=await pdfFromBuffer(await file.arrayBuffer());const p=parseReport(await pdfText(doc));if(!p.date)p.date=today();draftFile=file;showReview(p,file.name)}
  catch(e){showReview({date:today()},file.name,'Die PDF konnte nicht gelesen werden. Trag die Werte unten selbst ein.')}
}
$('file').addEventListener('change',e=>{handleFile(e.target.files[0]);e.target.value=''});
$('addLabel').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}});
const veil=$('veil');let veilT=0;
const hideVeil=()=>{clearTimeout(veilT);veil.hidden=true};
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();veil.hidden=false;clearTimeout(veilT);veilT=setTimeout(hideVeil,300)});
addEventListener('dragleave',e=>{if(!e.relatedTarget||e.clientX<=0||e.clientY<=0||e.clientX>=innerWidth||e.clientY>=innerHeight)hideVeil()});
addEventListener('drop',e=>{e.preventDefault();hideVeil();const f=e.dataTransfer?.files?.[0];if(f)handleFile(f)});
['dragend','pointerdown','pointermove','keydown','blur'].forEach(ev=>addEventListener(ev,hideVeil));
$('cancel').onclick=()=>{$('review').hidden=true;draft=null;draftFile=null};
$('save').onclick=async()=>{
  const r={change:draft?.change||{},periodStart:draft?.periodStart||null};
  for(const [k,,type] of FIELDS){const v=$('f_'+k).value.trim();r[k]=type?v:(v===''?null:toNum(v))}
  const msg=$('saveMsg');msg.classList.remove('err');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')){msg.textContent='Bitte ein Messdatum angeben.';msg.classList.add('err');return}
  if(r.weight==null){msg.textContent='Bitte mindestens das Gewicht eintragen.';msg.classList.add('err');return}
  r.savedAt=new Date().toISOString();const btn=$('save');btn.disabled=true;
  try{
    if(draftFile){try{const id='pdf-'+r.date;await tx('pdfs','readwrite',st=>st.put(draftFile,id));r.pdfAsset=id}catch(e){msg.textContent='PDF konnte nicht archiviert werden, Werte werden trotzdem gespeichert.'}}
    const old=reports.find(x=>x.date===r.date);if(old&&old.pdfAsset&&!r.pdfAsset)r.pdfAsset=old.pdfAsset;
    msg.textContent='Speichere …';await saveReport(r);selected=null;$('review').hidden=true;draft=null;draftFile=null;msg.textContent=''}
  catch(e){msg.textContent='Speichern fehlgeschlagen. Bitte nochmal versuchen.';msg.classList.add('err')}
  finally{btn.disabled=false}
};
$('range').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;rangeDays=+b.dataset.r;
  [...$('range').children].forEach(x=>x.classList.toggle('on',x===b));renderWeight();renderMinis()});

/* ---------- Boot ---------- */
{const d=new Date();$('todayLbl').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}
initFigure();render();loadAll();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ---------- Backup ---------- */
const b64=buf=>{let s='',u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
$('exportBtn').onclick=async()=>{
  const pdfs={};for(const r of reports)if(r.pdfAsset){const b=await tx('pdfs','readonly',st=>st.get(r.pdfAsset));if(b)pdfs[r.pdfAsset]=b64(await b.arrayBuffer())}
  const blob=new Blob([JSON.stringify({app:'bodyline',version:1,exported:new Date().toISOString(),reports,pdfs})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`bodyline-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const data=JSON.parse(await f.text());if(data.app!=='bodyline')throw 0;
    for(const [id,str] of Object.entries(data.pdfs||{})){const bin=atob(str),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      await tx('pdfs','readwrite',st=>st.put(new Blob([u],{type:'application/pdf'}),id))}
    for(const r of data.reports||[])await tx('reports','readwrite',st=>st.put(r));
    await loadAll();$('backupMsg').textContent=`${(data.reports||[]).length} Berichte importiert.`}
  catch(err){$('backupMsg').textContent='Das ist keine gültige Bodyline-Sicherung.'}});
</script>
